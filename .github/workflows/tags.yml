name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      versionWithoutRc: ${{ steps.metadata.outputs.versionWithoutRc }}
      archive: ${{ steps.metadata.outputs.archive }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
    steps:
      - name: Get metadata about the plugin
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          PLUGIN_VERSION=${RELEASE_TAG#v}
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "versionWithoutRc=${PLUGIN_VERSION%%-rc.*}" >> "$GITHUB_OUTPUT"
          echo "archive=frser-sqlite-datasource-${PLUGIN_VERSION}.zip" >> "$GITHUB_OUTPUT"
          if [[ "$PLUGIN_VERSION" == *-rc.* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
  create-artifacts:
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}
      - name: Check changelog
        run: |
          if ! grep -q -F "## [${{ needs.metadata.outputs.versionWithoutRc }}]" CHANGELOG.md; then
            echo "Error: The (## [${{ needs.metadata.outputs.versionWithoutRc }}]) tag was not found in the CHANGELOG.md."
            echo "Latest tag: ${{ needs.metadata.outputs.version }}" 1>&2
            exit 1
          fi
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: |
          make build-frontend
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.11
      - name: Install go dependencies
        run: make install-go-dependencies
      - name: build all versions
        run: make build-backend-all
      - name: package-and-zip
        env:
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
        run: make package-and-zip PLUGIN_VERSION=${{ needs.metadata.outputs.version }}
      - name: Lint plugin
        # the rc part of the version is rejected by the plugin validator
        if: ${{ needs.metadata.outputs.is_prerelease == 'false' }}
        run: >
          docker run --pull=always -e DEBUG=1 -v ${PWD}/:/the_app grafana/plugin-validator-cli
          /the_app/${{ needs.metadata.outputs.archive }}
        # do not provide a source code URI as the source code check fails due to:
        #  "error: It is not permitted to access the file system.""
        # -sourceCodeUri file:///the_app /the_app/${{ needs.metadata.outputs.archive }}
      - name: Upload plugin package
        uses: actions/upload-artifact@v6
        with:
          name: plugin-package
          path: ${{ needs.metadata.outputs.archive }}
  # testing on macos and windows is currently not done as docker is not available on the runners
  test-selenium-release-linux:
    runs-on: ubuntu-latest
    needs:
      - metadata
      - create-artifacts
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Download plugin package
        uses: actions/download-artifact@v7
        with:
          name: plugin-package
          path: ./
      - name: unzip plugin
        run: unzip ${{ needs.metadata.outputs.archive }} && mv frser-sqlite-datasource dist
      - name: update Grafana config to production values
        run: |
          sed -i 's/allow_loading_unsigned_plugins = true//g' grafana_config/grafana.ini
          sed -i 's/app_mode = development/app_mode = production/g' grafana_config/grafana.ini
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Selenium Tests
        env:
          VERBOSE_TEST_OUTPUT: 1
        run: make test-e2e-no-build
      - name: Debug Logs
        if: ${{ failure() }}
        run: docker compose logs grafana
  create-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    needs:
      - metadata
      - test-selenium-release-linux
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}
      - name: Download plugin package
        uses: actions/download-artifact@v7
        with:
          name: plugin-package
          path: ./
      - name: create md5 hash
        run: |
          md5sum ${{ needs.metadata.outputs.archive }} > ${{ needs.metadata.outputs.archive }}.md5
      - name: Generate artifact attestation
        id: attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ needs.metadata.outputs.archive }}
      - name: Set release notes
        id: set_release_notes
        run: |
          sed 's/$VERSION/${{ needs.metadata.outputs.version }}/g' release_template.md > release_notes.md
          echo "" >> release_notes.md

          # extracting the changelog for the current version (first ## heading)
          awk '/^## / {s++} s == 1 {print}' CHANGELOG.md > changelog_extract.md

          # skipping the first line (containing the version number)
          tail -n +2 changelog_extract.md >> release_notes.md

          echo "This build has been attested. You can view the [attestation details](${{ steps.attestation.outputs.attestation-url }})." >> release_notes.md

          echo "path=release_notes.md" >> $GITHUB_OUTPUT
      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets._GITHUB_TOKEN }}
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: Release ${{ needs.metadata.outputs.version }}
          body_path: ${{ steps.set_release_notes.outputs.path }}
          prerelease: ${{ needs.metadata.outputs.is_prerelease }}
          files: |
            ${{ needs.metadata.outputs.archive }}
            ${{ needs.metadata.outputs.archive }}.md5
